# Releases: work goes to dev through PRs from feat/, fix/, docs/… branches (pr-title.yml sets the commit type),
# dev is merged into main. release-please reads conventional commits on main and keeps a release PR
# with the next version and the CHANGELOG. Merging that PR tags vX.Y.Z, creates the GitHub Release
# and publishes to npm through trusted publishing (no token).
#
# If publishing failed, run this workflow by hand (Actions → Release → Run workflow) with the existing tag:
# it publishes that tag without making a new release. npm's trusted publisher must point at this file, release.yml,
# and allow the «npm publish» action.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish to npm, e.g. v0.1.0
        required: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - id: release
        if: ${{ github.event_name == 'push' }}
        uses: googleapis/release-please-action@v4
        with:
          # Releases are made from main only, whichever branch the workflow runs on.
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - id: target
        name: What to publish
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then tag="$INPUT_TAG"
          elif [ "$CREATED" = "true" ]; then tag="$RELEASE_TAG"
          else echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          { echo "publish=true"; echo "tag=$tag"; } >> "$GITHUB_OUTPUT"
          echo "Publishing $tag"

      - if: ${{ steps.target.outputs.publish == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.tag }}
          fetch-depth: 0

      # No registry-url here on purpose: it writes an .npmrc with a placeholder token, and when trusted publishing
      # fails npm falls back to that token and answers a vague 404. Without it a failure says what is wrong.
      - if: ${{ steps.target.outputs.publish == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted publishing needs npm 11.5.1 or later; take the latest rather than rely on the one bundled with Node.
      - if: ${{ steps.target.outputs.publish == 'true' }}
        run: npm install -g npm@latest && npm --version

      - if: ${{ steps.target.outputs.publish == 'true' }}
        run: npm ci

      # prepublishOnly runs typecheck, tests and the build. Provenance is added automatically with trusted publishing.
      # The verbose log shows the trusted publishing (OIDC) exchange, so a failure names its reason.
      - if: ${{ steps.target.outputs.publish == 'true' }}
        name: npm publish
        run: |
          set -o pipefail
          npm publish --access public --loglevel verbose 2>&1 | grep -viE "^npm (verbose|info) (cli|title|argv|logfile|cache|config|os|node|npm |cwd|exit)"

      # The release PR changes package.json and CHANGELOG.md on main only: bring them back to dev,
      # so the next release starts from the right version. A conflict stops here and needs a manual merge.
      - if: ${{ github.event_name == 'push' && steps.target.outputs.publish == 'true' }}
        name: Sync the release back to dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin dev >/dev/null; then
            git fetch origin main dev
            git checkout -B dev origin/dev
            git merge --no-edit origin/main
            git push origin dev
          fi
