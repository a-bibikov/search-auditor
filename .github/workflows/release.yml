# Releases. Work goes to dev through PRs from feat/issue-N, fix/issue-N, docs/issue-N… (pr-rules.yml),
# dev is merged into main. Every push to main — that is, every merge from dev — runs this workflow:
#
#   scripts/release.mjs reads the commits since the last tag: feat → minor, fix and docs → patch, nothing else
#   releases. If there is a release, a commit with the version in package.json is made next to main (main itself
#   only ever gets merges from dev), tagged vX.Y.Z, the GitHub Release is created, the package is published to npm
#   through trusted publishing (no token), and the floating major tag (v0, v1…) moves for the GitHub Action.
#
# A major version is made by hand only: Actions → Release → Run workflow on main with «major» on.
# If publishing failed, run it with «tag» set to the existing tag: it publishes that tag and makes nothing new.
# npm's trusted publisher must point at this file, release.yml.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      major:
        description: Release the next major version (X+1.0.0) from main
        type: boolean
        default: false
      tag:
        description: Or publish an existing tag again, e.g. v0.7.0 (when publishing failed)
        required: false

permissions:
  contents: write
  id-token: write

# Two merges in a row release one after the other, never at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # No registry-url here on purpose: it writes an .npmrc with a placeholder token, and when trusted publishing
      # fails npm falls back to that token and answers a vague 404. Without it a failure says what is wrong.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: next
        name: Next version
        if: ${{ !inputs.tag }}
        run: node scripts/release.mjs ${{ inputs.major && '--major' || '' }}

      - name: Release commit and tag
        if: ${{ steps.next.outputs.release == 'true' }}
        env:
          VERSION: ${{ steps.next.outputs.version }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          git commit -am "chore: release $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: GitHub Release
        if: ${{ steps.next.outputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md

      - id: target
        name: What to publish
        env:
          INPUT_TAG: ${{ inputs.tag }}
          NEW_TAG: ${{ steps.next.outputs.tag }}
        run: |
          tag="${INPUT_TAG:-$NEW_TAG}"
          if [ -z "$tag" ]; then echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          major="${tag#v}"; major="${major%%.*}"
          { echo "publish=true"; echo "tag=$tag"; echo "major=$major"; } >> "$GITHUB_OUTPUT"
          git checkout --quiet "$tag"
          echo "Publishing $tag"

      # Trusted publishing needs npm 11.5.1 or later; take the latest rather than rely on the one bundled with Node.
      - if: ${{ steps.target.outputs.publish == 'true' }}
        run: npm install -g npm@latest && npm --version

      - if: ${{ steps.target.outputs.publish == 'true' }}
        run: npm ci

      # prepublishOnly runs typecheck, tests and the build. Provenance is added automatically with trusted publishing.
      # The verbose log shows the trusted publishing (OIDC) exchange, so a failure names its reason.
      - if: ${{ steps.target.outputs.publish == 'true' }}
        name: npm publish
        run: |
          set -o pipefail
          npm publish --access public --loglevel verbose 2>&1 | grep -viE "^npm (verbose|info) (cli|title|argv|logfile|cache|config|os|node|npm |cwd|exit)"

      # Only a repository with a GitHub Action has users pinned to v0, v1…
      - if: ${{ steps.target.outputs.publish == 'true' && hashFiles('action.yml') != '' }}
        name: Move the major tag for the GitHub Action
        run: |
          git tag -f "v${{ steps.target.outputs.major }}" "${{ steps.target.outputs.tag }}"
          git push -f origin "v${{ steps.target.outputs.major }}"
